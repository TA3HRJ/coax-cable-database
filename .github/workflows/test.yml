name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Veri tutarlılığı (Python, standart kütüphane)
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: JS hesabı = Excel (eşlik testi)
        run: node --test tests/
      - name: Kamuya açık metin denetimi
        run: python scripts/check_public_text.py
